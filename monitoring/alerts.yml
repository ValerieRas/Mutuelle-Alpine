groups:
  - name: maa-scoring
    rules:
      - alert: LatenceP95Elevee
        expr: histogram_quantile(0.95, sum(rate(maa_scoring_latency_seconds_bucket[5m])) by (le)) > 0.25
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Latence p95 du scoring > 250 ms"}
      - alert: TauxErreurs
        expr: sum(rate(maa_scoring_requests_total{status="error"}[5m])) / sum(rate(maa_scoring_requests_total[5m])) > 0.02
        for: 5m
        labels: {severity: critical}
      - alert: TauxRevueAnormal   # métrique MÉTIER : capacité de la cellule anti-fraude
        expr: sum(increase(maa_revue_renforcee_total[1h])) / sum(increase(maa_scoring_requests_total{status="ok"}[1h])) > 0.15
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "Plus de 15 % des dossiers orientés en revue : dérive ou incident ?"}
      - alert: DeriveFeature
        expr: max(maa_feature_psi) > 0.25
        labels: {severity: warning}
